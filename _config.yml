# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: blank # the website title (if blank, full name will be used instead)
first_name: LaSAI
middle_name:
last_name: research lab
email: ecnie97@gmail.com
description: > # the ">" symbol means to ignore newlines until "footer_text:"
  Language Science & Artificial Intelligence research lab at Shanghai Jiao Tong University.
footer_text: >
  Language Science &amp; Artificial Intelligence · Shanghai Jiao Tong University.<br>
  Built with <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> and adapted from the
  <a href="https://github.com/mainlp/mainlp.github.io" target="_blank">MaiNLP</a>/<a href="https://github.com/alshedivat/al-folio" target="_blank">al-folio</a> themes.
keywords: LaSAI, Language Science, Artificial Intelligence, multilingual NLP, large language models, interpretability, Shanghai Jiao Tong University
lang: en # the language of your site (for example: en, fr, cn, ru, etc.)
icon: lasai-favicon.png # provide image name in /assets/img/

url: https://lasai-sjtu.github.io # the base hostname & protocol for your site
baseurl: / # the subpath of your site, e.g. /blog/
last_updated: true # display the last build date in the footer
impressum_path: # not used

# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------

# code highlighter theme
highlight_theme_light: github # https://github.com/jwarby/jekyll-pygments-themes
highlight_theme_dark: native # https://github.com/jwarby/jekyll-pygments-themes

# repo color theme
repo_theme_light: default # https://github.com/anuraghazra/github-readme-stats/blob/master/themes/README.md
repo_theme_dark: dark # https://github.com/anuraghazra/github-readme-stats/blob/master/themes/README.md

# -----------------------------------------------------------------------------
# RSS Feed
# -----------------------------------------------------------------------------
# will use title and url fields
# Take a look to https://github.com/jekyll/jekyll-feed for more customization

rss_icon: false

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: true
footer_fixed: false

# Dimensions
max_width: 1040px

# -----------------------------------------------------------------------------
# Open Graph & Schema.org
# -----------------------------------------------------------------------------
# Display links to the page with a preview object on social media.
serve_og_meta: true # Include Open Graph meta tags in the HTML head
serve_schema_org: true # Include Schema.org in the HTML head
og_image: /assets/img/lasai-logo.png # The site-wide (default for all links) Open Graph preview image

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  news:
    defaults:
      layout: post
    output: true
    permalink: /news/:path/
  projects:
    output: true
    permalink: /projects/:path/
  events:
    output: false
    permalink: /events/:path/

news_scrollable: true # adds a vertical scroll bar if there are more than 3 news items
news_limit: 5 # leave blank to include all the news in the `_news` folder

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

# Markdown and syntax highlight
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

# Includes & excludes
include: ["_pages"]
exclude:
  - bin
  - Gemfile
  - Gemfile.lock
  - vendor
keep_files:
  - CNAME
  - .nojekyll
  - .git

# Plug-ins
plugins:
  - jekyll-feed
  - jekyll-minifier
  - jekyll/scholar
  - jekyll-sitemap  # creates sitemap for search engines
  - jekyll-target-blank
  - jemoji

# Sitemap settings
defaults:
  - scope:
      path: "assets/**/*.*"
    values:
      sitemap: false

# -----------------------------------------------------------------------------
# Jekyll Minifier
# -----------------------------------------------------------------------------

jekyll-minifier:
  exclude: ["robots.txt"]
  # uglifier_args:
  #   harmony: true

# -----------------------------------------------------------------------------
# Jekyll Scholar
# -----------------------------------------------------------------------------

scholar:
  style: ieee
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template:
    - bib
    - highlight
  bibtex_filters: [latex, smallcaps, superscript]

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details

  sort_by: year,month
  order: descending

# Filter out certain bibtex entry keywords used internally from the bib output
filtered_bibtex_keywords:
  [
    abbr,
    abstract,
    arxiv,
    bibtex_show,
    html,
    pdf,
    selected,
    supp,
    blog,
    code,
    poster,
    slides,
    website,
    preview,
  ]

# Maximum number of authors to be shown for each publication (more authors are visible on click)
max_author_limit: 3 # leave blank to always show all authors
more_authors_animation_delay: 10 # more authors are revealed on click using animation; smaller delay means faster animation

# -----------------------------------------------------------------------------
# Responsive WebP Images
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Optional Features
# -----------------------------------------------------------------------------

enable_tooltips:
  false # enables automatic tooltip links generated
  # for each section titles on pages and posts
enable_darkmode: false # enables switching between light/dark modes
enable_project_categories:
  true # enables categorization of projects into
  # multiple categories

